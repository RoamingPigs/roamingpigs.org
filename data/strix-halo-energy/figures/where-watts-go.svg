<svg class="sh" viewBox="0 0 700 292" width="100%" role="img" aria-labelledby="f-watts-t f-watts-d" xmlns="http://www.w3.org/2000/svg"><title id="f-watts-t">Where the wall watts go</title><desc id="f-watts-d">9B dense: 140 W at the wall, of which idle 18, extra at the package 91, elsewhere 31; 12B dense: 151 W at the wall, of which idle 18, extra at the package 100, elsewhere 33; 26B mixture: 130 W at the wall, of which idle 18, extra at the package 82, elsewhere 31; 35B mixture: 140 W at the wall, of which idle 18, extra at the package 90, elsewhere 32</desc><rect x="120" y="14" width="12" height="12" rx="2" class="wf-idle"/><text x="138" y="25">Idle (18 W)</text><rect x="229.9" y="14" width="12" height="12" rx="2" class="wf-a"/><text x="247.9" y="25">Added at the chip</text><rect x="381.20000000000005" y="14" width="12" height="12" rx="2" class="wf-b"/><text x="399.20000000000005" y="25">Added elsewhere in the box</text><line class="g" x1="120.0" y1="46" x2="120.0" y2="258"/><text class="m" x="120.0" y="276" text-anchor="middle">0 W</text><line class="g" x1="222.0" y1="46" x2="222.0" y2="258"/><text class="m" x="222.0" y="276" text-anchor="middle">40 W</text><line class="g" x1="324.0" y1="46" x2="324.0" y2="258"/><text class="m" x="324.0" y="276" text-anchor="middle">80 W</text><line class="g" x1="426.0" y1="46" x2="426.0" y2="258"/><text class="m" x="426.0" y="276" text-anchor="middle">120 W</text><line class="g" x1="528.0" y1="46" x2="528.0" y2="258"/><text class="m" x="528.0" y="276" text-anchor="middle">160 W</text><line class="g" x1="630.0" y1="46" x2="630.0" y2="258"/><text class="m" x="630.0" y="276" text-anchor="middle">200 W</text><text class="t" x="108" y="78" text-anchor="end">9B dense</text><rect x="120.0" y="62" width="45.9" height="26" class="wf-idle"/><rect x="165.9" y="62" width="232.3" height="26" class="wf-a"/><rect x="398.2" y="62" width="80.0" height="26" class="wf-b"/><text class="v" x="486.3" y="80">140 W</text><text class="t" x="108" y="128" text-anchor="end">12B dense</text><rect x="120.0" y="112" width="45.9" height="26" class="wf-idle"/><rect x="165.9" y="112" width="254.4" height="26" class="wf-a"/><rect x="420.3" y="112" width="84.2" height="26" class="wf-b"/><text class="v" x="512.5" y="130">151 W</text><text class="t" x="108" y="178" text-anchor="end">26B mixture</text><rect x="120.0" y="162" width="45.9" height="26" class="wf-idle"/><rect x="165.9" y="162" width="208.9" height="26" class="wf-a"/><rect x="374.8" y="162" width="77.9" height="26" class="wf-b"/><text class="v" x="460.7" y="180">130 W</text><text class="t" x="108" y="228" text-anchor="end">35B mixture</text><rect x="120.0" y="212" width="45.9" height="26" class="wf-idle"/><rect x="165.9" y="212" width="229.4" height="26" class="wf-a"/><rect x="395.3" y="212" width="80.9" height="26" class="wf-b"/><text class="v" x="484.2" y="230">140 W</text></svg>